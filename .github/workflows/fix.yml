name: External Fix Prettier Formatting

on:
  workflow_dispatch: # trigger manually

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Clone forked repo with EXO token
        run: |
          git clone https://x-access-token:${{ secrets.EXO }}@github.com/zonalraid45/lila.git
          cd lila
          git checkout master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: lila
        run: pnpm install --frozen-lockfile

      - name: Run Prettier (fix mode)
        working-directory: lila
        run: pnpm prettier --config=ui/.prettierrc.json --cache --write .

      - name: Commit and push changes
        working-directory: lila
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: apply Prettier formatting" || echo "No changes to commit"
          git push origin master
