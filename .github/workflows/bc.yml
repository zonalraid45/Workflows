name: Clone & Check Format

on:
  workflow_dispatch:   # Run manually
  push:
    branches:
      - main
  pull_request:

jobs:
  clone-and-format:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone private repo
      - name: Clone lilaa repo
        run: |
          git clone https://x-access-token:${{ secrets.EXO }}@github.com/zonalraid45/lilaa.git
          cd lilaa
        shell: bash

      # Step 2: Setup Node.js (latest)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Step 3: Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          cd lilaa
          pnpm install

      # Step 5: Check code formatting
      - name: Check formatting
        run: |
          cd lilaa
          pnpm run check-format
        continue-on-error: true

      # Step 6: Auto-fix formatting if issues found
      - name: Fix formatting
        if: failure()
        run: |
          cd lilaa
          pnpm prettier --config=ui/.prettierrc.json --write .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-fix code formatting"
          git push https://x-access-token:${{ secrets.EXO }}@github.com/zonalraid45/lilaa.git HEAD:main
