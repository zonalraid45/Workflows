name: DeepWiki Auto Retry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # every hour

jobs:
  retry-deepwiki:
    runs-on: ubuntu-latest
    steps:
      - name: Clone lila repo
        run: |
          git clone https://github.com/zonalraid45/lila.git
          cd lila
          git checkout master

      - name: Show latest commit hash
        working-directory: lila
        run: |
          echo "Latest commit on master branch:"
          git rev-parse HEAD
          echo "Commit message:"
          git log -1 --pretty=%B

      - name: Trigger DeepWiki reindex
        run: |
          LATEST_COMMIT=$(git -C lila rev-parse HEAD)
          echo "Triggering DeepWiki reindex for commit $LATEST_COMMIT"
          curl -X POST \
            -H "Authorization: token ${{ secrets.EXO }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zonalraid45/lila/dispatches \
            -d '{"event_type":"deepwiki","client_payload":{"commit":"'"$LATEST_COMMIT"'"}}'

      - name: Notify
        run: echo "DeepWiki reindex triggered for commit $LATEST_COMMIT. Check https://deepwiki.com/zonalraid45/lila"
