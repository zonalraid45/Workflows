name: DeepWiki Update (external)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC

jobs:
  update-deepwiki:
    runs-on: ubuntu-latest

    steps:
      - name: Clone target repo (lila)
        run: |
          git clone https://github.com/zonalraid45/lila.git
          cd lila
          git checkout master

      - name: Show latest commit hash on master
        working-directory: lila
        run: |
          echo "Latest commit on master branch:"
          git rev-parse HEAD
          echo "Commit message:"
          git log -1 --pretty=%B

      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (optional)
        working-directory: lila
        run: |
          npm install || true

      - name: Trigger DeepWiki reindex
        run: |
          LATEST_COMMIT=$(git -C lila rev-parse HEAD)
          echo "Triggering DeepWiki reindex for commit $LATEST_COMMIT"
          curl -X POST \
            -H "Authorization: token ${{ secrets.EXO }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zonalraid45/lila/dispatches \
            -d '{"event_type":"deepwiki","client_payload":{"commit":"'"$LATEST_COMMIT"'"}}'
